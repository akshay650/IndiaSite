<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ALPHAYANTRA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alphayantra">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#0a0d14;overflow:hidden}#top{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#0a0d14;z-index:2}iframe{position:absolute;top:env(safe-area-inset-top,0px);left:0;width:100%;height:100%;border:0;display:block;background:#0a0d14}</style>
</head>
<body>
<div id="top"></div>
<iframe src="app.html" title="ALPHAYANTRA" allow="clipboard-write"></iframe>
<script>
(function(){var f=document.querySelector('iframe');function fit(){var t=document.getElementById('top').getBoundingClientRect().height||0;f.style.height=(window.innerHeight-t)+'px';}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,300);});fit();setTimeout(fit,500);})();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){});});}</script>
</body>
</html>
