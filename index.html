<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ALPHAYANTRA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alphayantra">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#000000;overflow:hidden}#top{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px)*.42);background:#000000;z-index:2}iframe{position:absolute;top:calc(env(safe-area-inset-top,0px)*.42);left:calc(env(safe-area-inset-left,0px)*.7);width:calc(100% - env(safe-area-inset-left,0px)*.7);height:100%;border:0;display:block;background:#000000}</style>
</head>
<body>
<div id="top"></div>
<iframe src="app.html?v=20261128a" title="ALPHAYANTRA" allow="clipboard-write"></iframe>
<script>
(function(){var f=document.querySelector('iframe');function fit(){var t=document.getElementById('top').getBoundingClientRect().height||0;f.style.height=(window.innerHeight-t)+'px';}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,300);});fit();setTimeout(fit,500);})();
window.addEventListener('message',function(e){var d=e.data;if(!d||d.ay!=='theme')return;var c=d.theme==='light'?'#f5f5f7':'#08080a';try{document.getElementById('top').style.background=c;document.body.style.background=c;document.documentElement.style.background=c;var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',c);}catch(x){}});
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();},{passive:false});});document.documentElement.style.touchAction='pan-x pan-y';
if('serviceWorker' in navigator){window.addEventListener('load',function(){var rl=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(rl)return;rl=true;location.reload();});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){try{var up=r.update();if(up&&up.catch)up.catch(function(){});}catch(e){}navigator.serviceWorker.ready.then(function(rr){if(rr.active)rr.active.postMessage({type:'ay-check'});});}).catch(function(){});});}</script>
</body>
</html>
